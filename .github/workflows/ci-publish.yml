name: CI and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: deresort_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: deresort_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, exif, gd, intl, mbstring, pcntl, pdo_mysql, pdo_sqlite, xml, xmlreader, xmlwriter, zip
          coverage: none
      - name: Prepare Laravel environment
        working-directory: server
        run: cp .env.example .env
      - name: Install PHP dependencies
        working-directory: server
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate test key
        working-directory: server
        run: php artisan key:generate --force
      - name: Run test suite
        working-directory: server
        run: php artisan test
      - name: Verify MySQL migrations
        working-directory: server
        run: php artisan migrate --database=mysql --force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build frontend
        working-directory: server
        run: npm ci && npm run build

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Dokploy
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_APPLICATION_ID" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "Dokploy deploy skipped; set repository variables and secret to enable it."
            exit 0
          fi
          jq -n --arg applicationId "$DOKPLOY_APPLICATION_ID" '{applicationId: $applicationId}' \
            | curl --fail --silent --show-error --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
                --header "accept: application/json" \
                --header "content-type: application/json" \
                --header "x-api-key: $DOKPLOY_API_KEY" \
                --data-binary @-
